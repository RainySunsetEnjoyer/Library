<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">

                    <h1 class="mb-4">
                        {{ quoteId !== null ? 'Redigera citat' : 'Lägg till nytt citat' }}
                    </h1>

                    <form [formGroup]="quoteForm" (ngSubmit)="onSubmit()">

                        <div class="mb-4">
                            <label for="text" class="form-label">
                                Citat
                            </label>

                            <textarea id="text" class="form-control" rows="3" placeholder="Skriv citatet här"
                                formControlName="text">
                            </textarea>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <button type="submit" class="btn btn-primary" [disabled]="quoteForm.invalid">

                                <i class="fa-solid me-1" [class.fa-plus]="quoteId === null"
                                    [class.fa-edit]="quoteId !== null">
                                </i>

                                {{ quoteId !== null
                                ? 'Redigera citat'
                                : 'Lägg till nytt citat' }}
                            </button>

                            <a routerLink="/quotes" class="btn btn-secondary">
                                Avbryt
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
