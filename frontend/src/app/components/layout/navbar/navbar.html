<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
    <div class="container">

        <a class="navbar-brand fw-semibold" routerLink="/books" (click)="closeMenu()">
            <i class="fa-solid fa-book-open me-2"></i>
            Azure Library
        </a>
        <button type="button"
            class="btn theme-toggle d-flex align-items-center justify-content-center d-lg-none ms-auto me-2"
            [class.theme-toggle-dark]="!isDarkMode()" [class.theme-toggle-light]="isDarkMode()" (click)="toggleTheme()">
            <i class="fa-solid" [class.fa-sun]="isDarkMode()" [class.fa-moon]="!isDarkMode()"></i>
        </button>

        <button class="navbar-toggler" type="button" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen"
            aria-controls="mainNavbar" aria-label="Öppna navigeringsmeny">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div id="mainNavbar" class="collapse navbar-collapse" [class.show]="isMenuOpen">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" routerLink="/books" routerLinkActive="active"
                        [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
                        <i class="fa-solid fa-book me-1"></i>
                        Böcker
                    </a>
                </li>

                @if (isLoggedIn$ | async) {
                <li class="nav-item">
                    <a class="nav-link" routerLink="/quotes" routerLinkActive="active" (click)="closeMenu()">
                        <i class="fa-solid fa-quote-left me-1"></i>
                        Mina citat
                    </a>
                </li>

                <button type="button" class="btn btn-outline-danger" (click)="logout(); closeMenu()">
                    <i class="fa-solid fa-right-from-bracket me-2"></i>
                    Logga ut
                </button>
                } @else {
                <a routerLink="/login" class="btn btn-primary" (click)="closeMenu()">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>
                    Logga in
                </a>
                }
            </ul>
            <button type="button"
                class="btn theme-toggle d-none d-lg-flex align-items-center justify-content-center ms-lg-3"
                [class.theme-toggle-dark]="!isDarkMode()" [class.theme-toggle-light]="isDarkMode()"
                (click)="toggleTheme()">

                <i class="fa-solid" [class.fa-sun]="isDarkMode()" [class.fa-moon]="!isDarkMode()">
                </i>
            </button>

        </div>
    </div>
</nav>
