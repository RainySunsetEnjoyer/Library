<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h1 class="card-title text-center mb-4">
                        Logga in
                    </h1>

                    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

                        <div class="mb-3">
                            <label for="username" class="form-label">
                                Användarnamn
                            </label>

                            <input id="username" type="text" class="form-control" placeholder="Ange användarnamn"
                                formControlName="username">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Lösenord
                            </label>

                            <input id="password" type="password" class="form-control" placeholder="Ange lösenord"
                                formControlName="password">
                        </div>

                        <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">
                            <i class="fa-solid fa-sign-in-alt me-2"></i>
                            Logga in
                        </button>

                    </form>

                    <div class="text-center mt-3">
                        <span class="text-muted">
                            Har du inget konto?
                        </span>

                        <a routerLink="/register" class="ms-1">
                            Skapa konto
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
